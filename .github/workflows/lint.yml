name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: |
          shellcheck -S warning \
            bin/omarchy-retroarch-theme \
            install.sh \
            uninstall.sh \
            hooks/theme-set.d/retroarch \
            hooks/font-set.d/retroarch
