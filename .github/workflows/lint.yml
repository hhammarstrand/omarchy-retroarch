name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Which tool is written in what is decided by its shebang, not by a list
      # kept in step with it by hand.
      - name: Sort the tools by shebang
        run: |
          sh= ; py=
          for f in bin/* install.sh uninstall.sh \
                   hooks/theme-set.d/retroarch hooks/font-set.d/retroarch; do
            case "$(head -1 "$f")" in
              *python*) py="$py $f" ;;
              *sh)      sh="$sh $f" ;;
              *)        echo "no shebang: $f" >&2; exit 1 ;;
            esac
          done
          echo "SH=$sh" >>"$GITHUB_ENV"
          echo "PY=$py" >>"$GITHUB_ENV"
          echo "shell:  $sh"
          echo "python: $py"

      - name: Shellcheck
        run: shellcheck -S warning $SH

      - name: Byte-compile the python tools
        run: python -m py_compile $PY
